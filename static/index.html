<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern, open-source RSS feed reader. Subscribe to feeds, search articles, and discover new content.">
    <title>RSS Feed Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 11a9 9 0 0 1 9 9"></path>
                    <path d="M4 4a16 16 0 0 1 16 16"></path>
                    <circle cx="5" cy="19" r="1"></circle>
                </svg>
                <h1>FeedFlow</h1>
            </div>
        </div>
        <div class="header-center">
            <div class="search-bar" id="searchBar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="Search articles..." autocomplete="off">
                <button class="search-clear" id="searchClear" title="Clear search">&times;</button>
            </div>
        </div>
        <div class="header-right">
            <button class="btn btn-icon" id="refreshAllBtn" title="Refresh all feeds">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
            </button>
            <button class="btn btn-icon" id="themeToggle" title="Toggle theme">
                <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-header">
                    <h2>Feeds</h2>
                    <button class="btn btn-sm btn-primary" id="addFeedBtn" title="Add feed">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Add Feed
                    </button>
                </div>
                <div class="feed-list" id="feedList">
                    <div class="feed-list-empty" id="feedListEmpty">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48">
                            <path d="M4 11a9 9 0 0 1 9 9"></path>
                            <path d="M4 4a16 16 0 0 1 16 16"></path>
                            <circle cx="5" cy="19" r="1"></circle>
                        </svg>
                        <p>No feeds yet</p>
                        <span>Click "Add Feed" to get started</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-header">
                    <h2>Discover</h2>
                </div>
                <div class="web-search-box">
                    <input type="text" id="webSearchInput" placeholder="Search for feeds online...">
                    <button class="btn btn-sm btn-accent" id="webSearchBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="2" y1="12" x2="22" y2="12"></line>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                        </svg>
                        Search Web
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <!-- Toolbar -->
            <div class="toolbar" id="toolbar">
                <div class="toolbar-left">
                    <button class="btn btn-text feed-filter active" data-feed="all" id="filterAll">All Articles</button>
                </div>
                <div class="toolbar-right">
                    <div class="view-toggle">
                        <button class="btn btn-icon btn-sm" id="viewTileBtn" title="Tile view" data-active="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                <rect x="3" y="3" width="7" height="7"></rect>
                                <rect x="14" y="3" width="7" height="7"></rect>
                                <rect x="3" y="14" width="7" height="7"></rect>
                                <rect x="14" y="14" width="7" height="7"></rect>
                            </svg>
                        </button>
                        <button class="btn btn-icon btn-sm" id="viewListBtn" title="List view">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                <line x1="8" y1="6" x2="21" y2="6"></line>
                                <line x1="8" y1="12" x2="21" y2="12"></line>
                                <line x1="8" y1="18" x2="21" y2="18"></line>
                                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                                <line x1="3" y1="18" x2="3.01" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="sort-controls">
                        <label for="sortSelect">Sort:</label>
                        <select id="sortSelect" class="select-input">
                            <option value="date">Date</option>
                            <option value="title">Title</option>
                            <option value="feed">Feed</option>
                        </select>
                        <button class="btn btn-icon btn-sm" id="sortOrderBtn" title="Toggle sort order" data-order="desc">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Articles -->
            <div class="articles-container" id="articlesContainer">
                <div class="articles-empty" id="articlesEmpty">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="64" height="64">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <h3>No articles to display</h3>
                    <p>Add a feed to start reading articles</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Feed Modal -->
    <div class="modal-overlay" id="addFeedModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Add RSS Feed</h2>
                <button class="btn btn-icon modal-close" id="addFeedModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="feedUrlInput">Feed URL</label>
                    <input type="url" id="feedUrlInput" placeholder="https://example.com/feed.xml" autocomplete="off">
                </div>
                <div class="form-error" id="addFeedError"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="addFeedCancelBtn">Cancel</button>
                <button class="btn btn-primary" id="addFeedSubmitBtn">
                    <span class="btn-text">Add Feed</span>
                    <span class="btn-spinner" style="display:none;"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Web Search Results Modal -->
    <div class="modal-overlay" id="webSearchModal">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h2>Feed Search Results</h2>
                <button class="btn btn-icon modal-close" id="webSearchModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="search-results" id="webSearchResults">
                    <div class="search-loading" id="webSearchLoading" style="display:none;">
                        <div class="spinner"></div>
                        <p>Searching for feeds...</p>
                    </div>
                    <div class="search-results-empty" id="webSearchEmpty">
                        <p>Enter a query to search for RSS feeds</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Confirm Modal -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h2 id="confirmModalTitle">Confirm</h2>
            </div>
            <div class="modal-body">
                <p id="confirmModalMessage"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="confirmCancelBtn">Cancel</button>
                <button class="btn btn-danger" id="confirmOkBtn">Remove</button>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/js/app.js"></script>
</body>
</html>
